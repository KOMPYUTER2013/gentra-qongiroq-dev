<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101311">
  <meta name="description" content="99-691-10-41 raqamiga qo‘ng‘iroq qiling.">
  <title>Gentra — qo‘ng‘iroq</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #101311;
      color: #f5f6f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --lime: #c6f36b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(198, 243, 107, .1), transparent 34rem),
        #101311;
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .contact-card {
      position: relative;
      display: grid;
      width: min(100%, 520px);
      min-height: 300px;
      place-items: center;
      padding: 48px 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 32px;
      background:
        radial-gradient(ellipse at 50% 0, rgba(198, 243, 107, .16), transparent 65%),
        linear-gradient(145deg, #202620, #151915);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .5), inset 0 1px rgba(255, 255, 255, .05);
    }

    .contact-card::before,
    .contact-card::after {
      position: absolute;
      width: 240px;
      height: 240px;
      border: 1px solid rgba(198, 243, 107, .1);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .contact-card::before {
      top: -175px;
      left: -115px;
    }

    .contact-card::after {
      right: -155px;
      bottom: -180px;
      width: 300px;
      height: 300px;
    }

    .actions {
      position: relative;
      width: min(100%, 390px);
    }

    .action {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 20px;
      border: 1px solid var(--lime);
      border-radius: 18px;
      background: linear-gradient(135deg, #d6ff87, var(--lime));
      box-shadow: 0 10px 36px rgba(198, 243, 107, .2);
      color: #161a12;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .action:hover {
      transform: translateY(-3px);
      background: #ddff9a;
      box-shadow: 0 15px 42px rgba(198, 243, 107, .3);
    }

    .action:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .icon {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      place-items: center;
    }

    .icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .number {
      font-size: clamp(20px, 5vw, 25px);
      font-weight: 750;
      letter-spacing: .025em;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      main {
        padding: 18px;
      }

      .contact-card {
        min-height: 240px;
        padding: 32px 20px;
        border-radius: 26px;
      }

      .action {
        min-height: 66px;
        gap: 10px;
        padding: 0 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="contact-card" aria-label="Telefon orqali bog‘lanish">
      <nav class="actions" aria-label="Telefon orqali bog‘lanish">
        <a class="action" href="tel:996911041">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7.2 3.8 9.5 3l2 4.7-2 1.5a15 15 0 0 0 5.3 5.3l1.5-2 4.7 2-.8 2.3a3 3 0 0 1-3.2 1.9A16.5 16.5 0 0 1 5.3 6.9a3 3 0 0 1 1.9-3.1Z"/></svg>
          </span>
          <span class="number">99-691-10-41</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
